name: CI — Validar docker-compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env de test
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=catalunya_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=catalunya_db
          POSTGRES_PORT=5432
          BACKEND_PORT=5000
          BACKEND_HOST_PORT=5001
          FRONTEND_PORT=80
          FRONTEND_HOST_PORT=8080
          PROXY_PORT=8000
          EOF

      - name: Validar sintaxi docker-compose
        run: docker compose config

      - name: Build de les imatges
        run: docker compose build

      - name: Arrencar serveis
        run: docker compose up -d

      - name: Esperar que el backend estigui sa
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Backend sa!"
              exit 0
            fi
            echo "Esperant... ($i)"
            sleep 2
          done
          echo "Timeout esperant el backend"
          docker compose logs
          exit 1

      - name: Comprovar endpoint provincies
        run: |
          curl -sf http://localhost:8000/api/provincies | grep -q Barcelona
          echo "Endpoint OK"

      - name: Aturar serveis
        if: always()
        run: docker compose down -v
