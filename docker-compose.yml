services:
  db:
    image: postgres:15-alpine
    container_name: catalunya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - catalunya_data:/var/lib/postgresql/data
    networks:
      - catalunya_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: catalunya_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catalunya_net

  frontend:
    build: ./frontend
    container_name: catalunya_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - catalunya_net

  proxy:
    build: ./proxy
    container_name: catalunya_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - catalunya_net

volumes:
  catalunya_data:

networks:
  catalunya_net:
    driver: bridge
