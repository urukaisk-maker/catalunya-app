services:
  db:
    image: postgres:15-alpine
    container_name: catalunya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
            - ./db/05_municipis_complets.sql:/docker-entrypoint-initdb.d/05_municipis.sql:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_ampliacion_datos.sql:/docker-entrypoint-initdb.d/02_ampliacion.sql:ro
      - ./db/03_fix_municipis_monuments.sql:/docker-entrypoint-initdb.d/03_fix.sql:ro
      - ./db/04_contingut_final.sql:/docker-entrypoint-initdb.d/04_final.sql:ro
      - catalunya_data:/var/lib/postgresql/data
    networks:
      - catalunya_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: catalunya_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_PORT: 5000
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catalunya_net

  frontend:
    build: ./frontend
    container_name: catalunya_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - catalunya_net

  proxy:
    build: ./proxy
    container_name: catalunya_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - catalunya_net

volumes:
  catalunya_data:

networks:
  catalunya_net:
    driver: bridge
